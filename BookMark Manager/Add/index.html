<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Bookmark</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <h1>Add a New Bookmark</h1>

  <script src="app.js"></script>

</html>
